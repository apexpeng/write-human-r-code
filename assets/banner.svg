<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">write-human-r-code</title><desc id="desc">R code that looks written, not generated.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#071D49"/><stop offset="55%" stop-color="#0A4FA3"/><stop offset="100%" stop-color="#1779D1"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.97"/><stop offset="100%" stop-color="#EAF4FF" stop-opacity="0.93"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#03132E" flood-opacity="0.35"/></filter></defs>
  <rect width="1600" height="500" rx="36" fill="url(#bg)"/><circle cx="1470" cy="40" r="245" fill="#FFFFFF" opacity="0.045"/><circle cx="1400" cy="515" r="315" fill="#FFFFFF" opacity="0.035"/>
  <g transform="translate(92 118)" filter="url(#shadow)"><rect width="190" height="190" rx="42" fill="#B8D9FF"/><path d="M54 66L20 95l34 29M136 66l34 29-34 29M111 42L79 148" fill="none" stroke="#0A4FA3" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#FFFFFF"><text x="340" y="160" font-size="67" font-weight="760">write-human-r-code</text><text x="342" y="220" font-size="30" font-weight="560" opacity="0.96">R code that looks written, not generated.</text><text x="342" y="273" font-size="23" opacity="0.78">Readable · reproducible · scientifically faithful · easy to maintain</text></g>
  <g transform="translate(1065 78)" filter="url(#shadow)"><rect width="400" height="328" rx="28" fill="url(#panel)"/><rect width="400" height="48" rx="28" fill="#D9EAFB"/><circle cx="30" cy="24" r="6" fill="#FF6B6B"/><circle cx="52" cy="24" r="6" fill="#FFD166"/><circle cx="74" cy="24" r="6" fill="#6FD08C"/><text x="105" y="31" font-family="Inter, Segoe UI, Arial" font-size="17" font-weight="700" fill="#31506F">analysis.R</text><g font-family="Consolas, Menlo, monospace" font-size="20" fill="#25405B"><text x="30" y="92" fill="#7A8FA3"># Read data</text><text x="30" y="125">df &lt;- read.csv("data.csv")</text><text x="30" y="171" fill="#7A8FA3"># Analyse</text><text x="30" y="204" fill="#145DA0">fit &lt;- lm(y ~ x, data = df)</text><text x="30" y="250" fill="#7A8FA3"># Plot</text><text x="30" y="283" fill="#138A67">plot(df$x, df$y)</text></g><circle cx="345" cy="267" r="42" fill="#276DC3"/><text x="345" y="281" text-anchor="middle" font-family="Inter, Arial" font-size="40" font-weight="800" fill="#FFFFFF">R</text></g>
  <g transform="translate(340 340)" font-family="Inter, Segoe UI, Arial" font-size="18" font-weight="650" fill="#FFFFFF"><g><rect width="110" height="46" rx="23" fill="#FFFFFF" opacity="0.14"/><text x="55" y="29" text-anchor="middle">R Code</text></g><g transform="translate(124 0)"><rect width="150" height="46" rx="23" fill="#FFFFFF" opacity="0.14"/><text x="75" y="29" text-anchor="middle">Human-first</text></g><g transform="translate(288 0)"><rect width="172" height="46" rx="23" fill="#FFFFFF" opacity="0.14"/><text x="86" y="29" text-anchor="middle">Reproducible</text></g><g transform="translate(474 0)"><rect width="170" height="46" rx="23" fill="#FFFFFF" opacity="0.14"/><text x="85" y="29" text-anchor="middle">Scientific code</text></g></g>
